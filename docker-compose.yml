services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabbalens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabbalens}
      POSTGRES_DB: ${POSTGRES_DB:-sabbalens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabbalens} -d ${POSTGRES_DB:-sabbalens}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5434}:5432"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://sabbalens:sabbalens@db:5432/sabbalens
      UPLOAD_DIR: /data/uploads
      DEBUG: "false"
    volumes:
      - ./data:/data
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app
    restart: unless-stopped

volumes:
  postgres_data: