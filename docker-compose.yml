services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/sabbalens.db
      UPLOAD_DIR: /data/uploads
      DEBUG: "false"
    volumes:
      - ./data:/data
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped